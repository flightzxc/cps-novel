# Host Nginx is intentionally not a service here. Ubuntu nginx 1.24 owns the
# edge and proxies only to web's loopback binding from the root compose file.
services:
  # Capacity work order (Owner 2026-09-27): postgres deliberately carries NO
  # mem_limit, unlike the four app services below. Two reasons:
  #   1) effective_cache_size=10GB (infra/postgres/pitr/
  #      postgresql.conf.example) is the planner's estimate of *host-wide*
  #      OS page cache available for caching beyond shared_buffers. A cgroup
  #      mem_limit on this container would cap page-cache reclaim to that
  #      container's own cgroup, not the host, undermining exactly the
  #      assumption effective_cache_size encodes -- capping Postgres itself
  #      fights the tuning done above it, it does not defend it.
  #   2) Postgres's memory model bounds the actual risk this task cares
  #      about (a leaking process eating all RAM with no swap to fall back
  #      on) far better than Node's growing heap does on its own: per-
  #      connection work_mem is capped (16MB, worst case 100 x 16MB=1.6GB),
  #      maintenance_work_mem likewise (512MB x autovacuum_max_workers(3) =
  #      1.5GB worst case), and shared_buffers is a fixed 4GB segment sized
  #      at container start, not a growing allocation.
  #   Budget check (16 GiB host, no swap, verified free -h 2026-09-27: 15.62
  #   GiB total): shared_buffers(4GB) + worst-case work_mem(1.6GB) +
  #   worst-case maintenance_work_mem(1.5GB) + per-backend overhead
  #   (~2-3MB x realistic ~50 peak connections ~= 150MB) ~= 7.3GB Postgres
  #   ceiling, well inside "shared_buffers + 2g" (6GB) suggested as a floor
  #   for an explicit limit -- if this container is later given one, 8g is
  #   the number to use. App mem_limits (web 2g + worker 2g + worker-light
  #   1g + scheduler 512m = 5.5GB) + this ~7.3GB Postgres ceiling = ~12.8GB,
  #   leaving >2.5GB for the OS, Docker's own overhead, and the page cache
  #   effective_cache_size is counting on.
  postgres:
    entrypoint: ["/bin/bash", "/opt/cps-novel-preprod/postgres-entrypoint.sh"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "listen_addresses=*"]
    # Capacity work order (Owner 2026-09-27): Docker's default (64 MiB) is
    # too small for PostgreSQL parallel query workers, which stage data in
    # POSIX shared memory (/dev/shm) before it lands in shared_buffers --
    # observed failure mode elsewhere is "could not resize shared memory
    # segment ... No space left on device" the first time a parallel hash
    # join or sort actually needs it, not at startup. 1 GiB is generous
    # headroom relative to work_mem(16MB) x max_parallel_workers(4) and
    # leaves shared_buffers(4GB, see infra/postgres/pitr/
    # postgresql.conf.example) untouched -- shm_size only affects the
    # separate /dev/shm tmpfs, not the shared_buffers segment itself.
    # 🔴 This value is NOT synced to infra/production-like/docker-compose.yml
    # (the local X8 rehearsal overlay, used on developer machines with
    # varying RAM/Docker-VM budgets, not the 16 GiB haiyue-vps baseline this
    # file is scoped to) -- see that file's own postgres block, left
    # untouched, and infra/preproduction/README.md for the explicit
    # rationale.
    shm_size: "1gb"
    environment:
      P1_06_WAL_ARCHIVE_DIR: /var/lib/postgresql/wal-archive
    volumes:
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/wal-archive:/var/lib/postgresql/wal-archive
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/backups/base:/var/lib/postgresql/base-backups
      - ./infra/postgres/pitr/postgresql.conf.example:/etc/postgresql/postgresql.conf:ro
      - ./infra/preproduction/postgres-entrypoint.sh:/opt/cps-novel-preprod/postgres-entrypoint.sh:ro
      - ./scripts/db/archive-wal.sh:/app/scripts/db/archive-wal.sh:ro

  web:
    # 🔴 build: !reset null —— 目标机上**不存在构建源**。
    #
    # 根 compose 的 x-app-runtime 同时带 image: 与 build:（构建机需要 build:，
    # build-release-archive.sh 只用根文件构建，不加载本 overlay）。目标机上留着
    # 它是危险的：Compose v5 的 `run` 没有 `--no-build` 可用，而镜像缺失时
    # `run --pull never` 会**就地构建并以 0 退出**——目标机于是跑着一个没被批准、
    # 没经过归档校验、身份与 release manifest 无关的工件。抹掉 build: 段之后，
    # 镜像缺失只能以 "No such image" 失败，这正是要的 fail-closed。
    #
    # 必须是 `!reset`：普通 `build: null` 覆盖不掉基文件里的 mapping（实测 merged
    # config 里 build: 仍在）。`!reset` 在 Compose v5.0.1 / v5.5.1 上均已实测生效。
    # CPS 短剧的生产 overlay 用同一语法清空 ports（docker-compose.prod.example.yml）。
    build: !reset null
    # 🔴 pull_policy: never —— 应用镜像只能来自已验证的归档 docker load，
    # 不允许从任何 registry 拉取。这是脚本层 --pull never 之外的第二道闸：
    # 有人绕过 preprod_compose_app_up 直接 `docker compose up` 时它仍然生效。
    pull_policy: never
    # Capacity work order (Owner 2026-09-27): no swap on this host (verified
    # read-only, 2026-09-27) -- an unbounded Node process leak could exhaust
    # host memory and take Postgres down with it via the OOM killer's choice
    # of victim. mem_limit is the container-level backstop; NODE_OPTIONS'
    # --max-old-space-size is the in-process backstop underneath it, set to
    # ~75% of mem_limit (1536 of 2048 MiB) so V8 triggers its own GC/OOM
    # well before the container's cgroup limit kills the process outright --
    # the gap between the two also covers Node's non-heap memory (buffers,
    # native modules, the RSS the heap limit does not itself account for).
    # See infra/preproduction/README.md for the full 16 GiB host budget
    # (four app mem_limits + Postgres headroom + OS page cache).
    mem_limit: 2g
    # 2026-09-27 (Owner-approved): web (1001:1001) needs to
    # enter/read /opt/cps-novel/shared/backups (deploy:deploy 1000:1000,
    # mode 0750) to read backup-timer's last-success.json for
    # /api/health/backup -- without a supplementary group, stat() on that
    # directory is EACCES for uid 1001 and backup-status.ts maps "exists but
    # unreadable" straight to `failed`, regardless of real backup freshness.
    # "1000" is the runbook's fixed deploy gid (docs/operations/
    # PREPRODUCTION_DEPLOYMENT_RUNBOOK.md, "One-time Owner sudo steps" §3-4).
    # The mount below stays `:ro`, so this is read-only exposure, not write
    # access. Secrets under /opt/cps-novel/shared/secrets are unaffected --
    # they carry `group::---` ACLs (secrets-preflight.sh), so group 1000
    # membership grants nothing there. Known side effect: web can now also
    # list file NAMES under backups/logical/ (e.g. via readdir) -- the dump
    # files themselves stay root:root 0600 (backup-loop.sh's `umask 077`)
    # and remain unreadable to web either way.
    group_add: ["1000"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"
      TRACKING_HASH_SALT: ""
      TRACKING_HASH_SALT_FILE: /run/secrets/tracking_hash_salt
      TOTP_ENCRYPTION_KEY: ""
      TOTP_ENCRYPTION_KEY_FILE: /run/secrets/totp_encryption_key
      PUBLIC_TRACKING_WRITE_DISABLED: "1"
      ADMIN_TWO_FACTOR_ENFORCEMENT: "true"
      # B-39: the Turnstile secret key reaches web only as a file (never a
      # literal in this env, mirroring TOTP above): the direct value is pinned
      # empty so a stray ADMIN_LOGIN_TURNSTILE_SECRET_KEY in preprod.env cannot
      # leak through the root compose passthrough, and start-web.sh loads the
      # file only when ADMIN_LOGIN_TURNSTILE_ENABLED is exactly "true". The
      # switch and the public site key are NOT pinned here -- they pass through
      # from preprod.env via the root compose (default off).
      ADMIN_LOGIN_TURNSTILE_SECRET_KEY: ""
      ADMIN_LOGIN_TURNSTILE_SECRET_KEY_FILE: /run/secrets/admin_login_turnstile_secret_key
      BACKUP_OUTPUT_DIR: /var/lib/cps-novel/backups/logical
      BACKUP_STATUS_FILE: /var/lib/cps-novel/backups/last-success.json
    volumes:
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/backups:/var/lib/cps-novel/backups:ro
    secrets:
      - tracking_hash_salt
      - totp_encryption_key
      - admin_login_turnstile_secret_key

  worker:
    # 同 web：目标机不得具备就地构建能力，见上面的说明。
    build: !reset null
    pull_policy: never
    stop_grace_period: 45s
    # Same rationale as web's own comment above. Worker's peak heap use is
    # the moboreader/catalog-sync adapters buffering upstream JSON pages in
    # memory; 2g/1536m matches web's budget as the conservative starting
    # point pending real memory-usage evidence from production traffic.
    mem_limit: 2g
    environment:
      NODE_OPTIONS: "--max-old-space-size=1536"

  worker-light:
    build: !reset null
    pull_policy: never
    stop_grace_period: 45s
    # worker-light only ever runs the light lane's allowlist (sitemap /
    # carousel / daily-fallback tasks -- see WORKER_LIGHT_TASK_ALLOWLIST),
    # a materially smaller working set than worker's catalog/moboreader
    # lane, hence half worker's budget rather than the same 2g.
    mem_limit: 1g
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"

  scheduler:
    # 同 web：目标机不得具备就地构建能力，见上面的说明。
    build: !reset null
    pull_policy: never
    # scheduler/index.ts only enqueues/ticks (no upstream fetch, no large
    # buffering) and scripts/run-scheduler-loop.sh execs `tsx
    # scheduler/index.ts &` as a plain bash background job inside the SAME
    # container/cgroup -- POSIX process environment inheritance means that
    # child process sees this NODE_OPTIONS without any extra wiring (bash
    # `&` does not strip the environment; verified locally, see this
    # branch's rehearsal notes). 512m / 384m stays generous headroom above
    # scheduler's observed idle footprint (~2 MiB RSS on haiyue-vps,
    # measured 2026-09-27) for its short-lived per-tick tsx process.
    mem_limit: 512m
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"

  backup-timer:
    image: postgres:16.14
    restart: unless-stopped
    command: ["/bin/bash", "/opt/cps-novel-preprod/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: cps_novel
      PGUSER: backup_role
      PGPASSFILE: /run/secrets/backup_role_pgpass
      PREPROD_BACKUP_INTERVAL_SECONDS: "86400"
      PREPROD_LOGICAL_RETENTION_DAYS: "14"
      PREPROD_BASE_BACKUP_MIN_AGE_SECONDS: "604800"
    volumes:
      - ./infra/preproduction/backup-loop.sh:/opt/cps-novel-preprod/backup-loop.sh:ro
      - ./scripts/db/backup-logical.sh:/app/scripts/db/backup-logical.sh:ro
      - ./scripts/db/backup-physical-base.sh:/app/scripts/db/backup-physical-base.sh:ro
      - ./scripts/db/verify-physical-base.sh:/app/scripts/db/verify-physical-base.sh:ro
      - ./scripts/db/wal-retention.sh:/app/scripts/db/wal-retention.sh:ro
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/backups:/var/lib/cps-novel/backups
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/wal-archive:/var/lib/postgresql/wal-archive
    secrets:
      - backup_role_pgpass
    networks:
      - runtime
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Freshness healthcheck (2026-09-27, Owner-approved):
    # backup-loop.sh writes last-success.json ONLY at the very end of a fully
    # successful run_once() (set -euo pipefail means a failed run never
    # touches it). Healthy iff that file exists and its mtime is under 26h
    # (1560min) old -- 24h loop interval + 2h grace, kept equal to
    # `DEFAULT_STALE_THRESHOLD_HOURS` in src/server/health/backup-status.ts
    # (see tests/backend/runtime/preproduction-backup-timer-healthcheck.test.ts,
    # which derives both numbers from those two sources and fails if they
    # drift). No `$` in the test string -- Compose would try to interpolate it.
    #
    # What this DETECTS: the loop hung, or every run has failed, for >26h
    # while the container keeps running -- surfaces as `unhealthy` in
    # `docker compose ps` / `docker inspect .State.Health.Status`.
    #
    # 🔴 What this does NOT detect: a STOPPED/Exited container has no health
    # status at all -- this was the actual 2026-09-22 -> 2026-09-27 silent
    # failure (5 days). An ops step used backup-timer as a one-shot backup
    # then ran `stop backup-timer`, and nothing restarted it. A healthcheck
    # cannot substitute for checking the container is running. For an
    # ad-hoc backup, exec into the running container instead of a
    # start-then-stop cycle:
    #   preprod_compose exec -T backup-timer /bin/bash \
    #     /app/scripts/db/backup-logical.sh --output <file>
    healthcheck:
      test: ["CMD-SHELL", "find /var/lib/cps-novel/backups/last-success.json -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      # A stale marker left over from before a restart must not flip the
      # container unhealthy while the first run_once() is still in
      # progress -- it starts immediately at container start, and on some
      # cycles includes a weekly pg_basebackup + restore verification that
      # can take many minutes as the DB grows.
      start_period: 1h

networks:
  runtime:
    name: cps_novel_runtime
    # Pinned subnet -- do not remove the ipam block.
    #
    # Without an explicit ipam config Docker auto-allocates a subnet for
    # this network, and that allocation is silent and can change on any
    # `docker network rm` + recreate (it depends on what other networks
    # already exist on the host at creation time). Measured on this host:
    # auto-allocation picked 172.16.1.0/24. That is the latent bug, not
    # just the current mismatch -- even if today's auto-allocated subnet
    # happened to match, a future recreate could silently pick a different
    # one again.
    #
    # infra/postgres/hba-replication-rule.sh bakes a pg_hba.conf
    # replication rule for backup_role at initdb time, scoped to
    # X8_RUNTIME_SUBNET (default 172.18.0.0/16, see docker-compose.yml's
    # `postgres.environment.X8_RUNTIME_SUBNET`). That rule is written once
    # and is never re-derived afterward, so this network's subnet must
    # match it -- not the other way round. A mismatch rejects every
    # replication connection ("no pg_hba.conf entry for replication
    # connection from host ...", observed on this host from 172.16.1.3),
    # which makes pg_basebackup, and therefore PITR, impossible.
    #
    # Keep this exactly equal to hba-replication-rule.sh's default subnet;
    # tests/backend/runtime/preproduction-deployment-contract.test.ts
    # asserts the two cannot drift apart.
    #
    # Changing this subnet on an EXISTING deployment requires removing the
    # network first (Docker will not re-IPAM a network in place). Do NOT
    # manually `docker network rm cps_novel_runtime` after stopping the
    # containers -- verified broken: `docker network rm` succeeds even with
    # stopped containers attached, but the stopped container keeps a
    # reference to the removed network id, so the next `up` fails
    # ("failed to set up container networking: network <old id> not
    # found") and postgres stays `exited`. Use one of, instead:
    #   - `docker compose down` (WITHOUT `-v`/`--volumes`) then `up`; or
    #   - stop the containers, then plain `up -d` -- Compose detects the
    #     IPAM change itself and replaces the network in place (observed:
    #     Stopping -> Network Removed -> Creating -> Created -> Starting).
    # Verified on Compose v5.0.1; confirm the same self-replacement
    # behaviour against the host's actual compose version before relying
    # on it. Either path leaves the postgres_data volume untouched --
    # `-v`/`--volumes` on `down` is what would delete it
    # (cps_novel_postgres_data), so never pass that flag here.
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  postgres_data:
    name: cps_novel_postgres_data
  sitemap_static:
    name: cps_novel_sitemap_static

secrets:
  tracking_hash_salt:
    file: ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/secrets/tracking_hash_salt
  totp_encryption_key:
    file: ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/secrets/totp_encryption_key
  # B-39: a CONDITIONAL secret -- the one Docker secret in this file that must
  # not exist on a host until the Owner turns Turnstile on. A Compose file
  # secret whose source is missing makes `up` fail ("bind source path does not
  # exist", verified on Compose v5.0.1), which would take the whole web
  # container -- and the public site with it -- down at release time, before any
  # key exists. So the source defaults to /dev/null (mounts fine, reads empty,
  # never read while the switch is off), and scripts/preproduction/lib.sh's
  # `preprod_compose` points ADMIN_LOGIN_TURNSTILE_SECRET_SOURCE at
  # <PREPROD_SHARED_ROOT>/secrets/admin_login_turnstile_secret_key if and only if
  # ADMIN_LOGIN_TURNSTILE_ENABLED is exactly "true". Its presence, mode, owner
  # and ACL are then enforced by secrets-preflight.sh's conditional entry.
  admin_login_turnstile_secret_key:
    file: ${ADMIN_LOGIN_TURNSTILE_SECRET_SOURCE:-/dev/null}
  backup_role_pgpass:
    file: ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/secrets/backup_role.pgpass
