# Host Nginx is intentionally not a service here. Ubuntu nginx 1.24 owns the
# edge and proxies only to web's loopback binding from the root compose file.
services:
  postgres:
    entrypoint: ["/bin/bash", "/opt/cps-novel-preprod/postgres-entrypoint.sh"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "listen_addresses=*"]
    environment:
      P1_06_WAL_ARCHIVE_DIR: /var/lib/postgresql/wal-archive
    volumes:
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/wal-archive:/var/lib/postgresql/wal-archive
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/backups/base:/var/lib/postgresql/base-backups
      - ./infra/postgres/pitr/postgresql.conf.example:/etc/postgresql/postgresql.conf:ro
      - ./infra/preproduction/postgres-entrypoint.sh:/opt/cps-novel-preprod/postgres-entrypoint.sh:ro
      - ./scripts/db/archive-wal.sh:/app/scripts/db/archive-wal.sh:ro

  web:
    # 🔴 build: !reset null —— 目标机上**不存在构建源**。
    #
    # 根 compose 的 x-app-runtime 同时带 image: 与 build:（构建机需要 build:，
    # build-release-archive.sh 只用根文件构建，不加载本 overlay）。目标机上留着
    # 它是危险的：Compose v5 的 `run` 没有 `--no-build` 可用，而镜像缺失时
    # `run --pull never` 会**就地构建并以 0 退出**——目标机于是跑着一个没被批准、
    # 没经过归档校验、身份与 release manifest 无关的工件。抹掉 build: 段之后，
    # 镜像缺失只能以 "No such image" 失败，这正是要的 fail-closed。
    #
    # 必须是 `!reset`：普通 `build: null` 覆盖不掉基文件里的 mapping（实测 merged
    # config 里 build: 仍在）。`!reset` 在 Compose v5.0.1 / v5.5.1 上均已实测生效。
    # CPS 短剧的生产 overlay 用同一语法清空 ports（docker-compose.prod.example.yml）。
    build: !reset null
    # 🔴 pull_policy: never —— 应用镜像只能来自已验证的归档 docker load，
    # 不允许从任何 registry 拉取。这是脚本层 --pull never 之外的第二道闸：
    # 有人绕过 preprod_compose_app_up 直接 `docker compose up` 时它仍然生效。
    pull_policy: never
    environment:
      TRACKING_HASH_SALT: ""
      TRACKING_HASH_SALT_FILE: /run/secrets/tracking_hash_salt
      TOTP_ENCRYPTION_KEY: ""
      TOTP_ENCRYPTION_KEY_FILE: /run/secrets/totp_encryption_key
      PUBLIC_TRACKING_WRITE_DISABLED: "1"
      ADMIN_TWO_FACTOR_ENFORCEMENT: "true"
      BACKUP_OUTPUT_DIR: /var/lib/cps-novel/backups/logical
      BACKUP_STATUS_FILE: /var/lib/cps-novel/backups/last-success.json
    volumes:
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/backups:/var/lib/cps-novel/backups:ro
    secrets:
      - tracking_hash_salt
      - totp_encryption_key

  worker:
    # 同 web：目标机不得具备就地构建能力，见上面的说明。
    build: !reset null
    pull_policy: never
    stop_grace_period: 45s

  scheduler:
    # 同 web：目标机不得具备就地构建能力，见上面的说明。
    build: !reset null
    pull_policy: never

  backup-timer:
    image: postgres:16.14
    restart: unless-stopped
    command: ["/bin/bash", "/opt/cps-novel-preprod/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: cps_novel
      PGUSER: backup_role
      PGPASSFILE: /run/secrets/backup_role_pgpass
      PREPROD_BACKUP_INTERVAL_SECONDS: "86400"
      PREPROD_LOGICAL_RETENTION_DAYS: "14"
      PREPROD_BASE_BACKUP_MIN_AGE_SECONDS: "604800"
    volumes:
      - ./infra/preproduction/backup-loop.sh:/opt/cps-novel-preprod/backup-loop.sh:ro
      - ./scripts/db/backup-logical.sh:/app/scripts/db/backup-logical.sh:ro
      - ./scripts/db/backup-physical-base.sh:/app/scripts/db/backup-physical-base.sh:ro
      - ./scripts/db/verify-physical-base.sh:/app/scripts/db/verify-physical-base.sh:ro
      - ./scripts/db/wal-retention.sh:/app/scripts/db/wal-retention.sh:ro
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/backups:/var/lib/cps-novel/backups
      - ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/wal-archive:/var/lib/postgresql/wal-archive
    secrets:
      - backup_role_pgpass
    networks:
      - runtime
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  runtime:
    name: cps_novel_runtime
    # Pinned subnet -- do not remove the ipam block.
    #
    # Without an explicit ipam config Docker auto-allocates a subnet for
    # this network, and that allocation is silent and can change on any
    # `docker network rm` + recreate (it depends on what other networks
    # already exist on the host at creation time). Measured on this host:
    # auto-allocation picked 172.16.1.0/24. That is the latent bug, not
    # just the current mismatch -- even if today's auto-allocated subnet
    # happened to match, a future recreate could silently pick a different
    # one again.
    #
    # infra/postgres/hba-replication-rule.sh bakes a pg_hba.conf
    # replication rule for backup_role at initdb time, scoped to
    # X8_RUNTIME_SUBNET (default 172.18.0.0/16, see docker-compose.yml's
    # `postgres.environment.X8_RUNTIME_SUBNET`). That rule is written once
    # and is never re-derived afterward, so this network's subnet must
    # match it -- not the other way round. A mismatch rejects every
    # replication connection ("no pg_hba.conf entry for replication
    # connection from host ...", observed on this host from 172.16.1.3),
    # which makes pg_basebackup, and therefore PITR, impossible.
    #
    # Keep this exactly equal to hba-replication-rule.sh's default subnet;
    # tests/backend/runtime/preproduction-deployment-contract.test.ts
    # asserts the two cannot drift apart.
    #
    # Changing this subnet on an EXISTING deployment requires removing the
    # network first (Docker will not re-IPAM a network in place). Do NOT
    # manually `docker network rm cps_novel_runtime` after stopping the
    # containers -- verified broken: `docker network rm` succeeds even with
    # stopped containers attached, but the stopped container keeps a
    # reference to the removed network id, so the next `up` fails
    # ("failed to set up container networking: network <old id> not
    # found") and postgres stays `exited`. Use one of, instead:
    #   - `docker compose down` (WITHOUT `-v`/`--volumes`) then `up`; or
    #   - stop the containers, then plain `up -d` -- Compose detects the
    #     IPAM change itself and replaces the network in place (observed:
    #     Stopping -> Network Removed -> Creating -> Created -> Starting).
    # Verified on Compose v5.0.1; confirm the same self-replacement
    # behaviour against the host's actual compose version before relying
    # on it. Either path leaves the postgres_data volume untouched --
    # `-v`/`--volumes` on `down` is what would delete it
    # (cps_novel_postgres_data), so never pass that flag here.
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  postgres_data:
    name: cps_novel_postgres_data
  sitemap_static:
    name: cps_novel_sitemap_static

secrets:
  tracking_hash_salt:
    file: ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/secrets/tracking_hash_salt
  totp_encryption_key:
    file: ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/secrets/totp_encryption_key
  backup_role_pgpass:
    file: ${PREPROD_SHARED_ROOT:-/opt/cps-novel/shared}/secrets/backup_role.pgpass
