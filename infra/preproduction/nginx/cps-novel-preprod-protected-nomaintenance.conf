# Same as cps-novel-preprod-protected.conf, minus the maintenance gate.
#
# The maintenance check in the sibling snippet is an `if` in nginx's
# rewrite phase, which is evaluated BEFORE the access phase where
# `auth_basic` runs. That means, on the protected snippet, a maintenance
# window wins over an unauthenticated caller's auth challenge instead of
# the other way around. There is no rewrite-phase equivalent of auth_basic
# to reorder against, so the fix is a separate snippet that simply omits
# that gate.
#
# Use this only for locations that must stay verifiable through a
# maintenance window (currently: /api/health on both hosts) while remaining
# behind the exact same Basic Auth as everything else. It must never be used
# for a location that serves business content or admin functionality.
# See docs/adr/ADR-PREPROD-EDGE-MAINTENANCE-AND-ADMIN-ASSETS.md.
auth_basic "CPS Novel Preproduction";
auth_basic_user_file /opt/cps-novel/shared/secrets/nginx-preprod.htpasswd;
include /etc/nginx/snippets/cps-novel-preprod-security.conf;
