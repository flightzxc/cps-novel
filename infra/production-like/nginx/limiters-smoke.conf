worker_processes 1;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/x8-source/snippets/limit-zones.conf;
    limit_req_status 429;
    limit_conn_status 429;
    access_log /dev/stdout combined;

    upstream app_backend {
        server x8-slow-upstream:3000;
    }

    server {
        listen 8080;
        server_name novel.test;
        include /etc/nginx/x8-source/snippets/capacity-locations.conf;
    }
}
