map $http_user_agent $x8_ai_client {
    default "";
    ~*(ClaudeBot|GPTBot|Bytespider) $binary_remote_addr;
}

map $arg_page $x8_deep_page_client {
    default "";
    ~^(?:[4-9]|[1-9][0-9]+)$ $binary_remote_addr;
}

limit_conn_zone $server_name zone=x8_novel_conc:1m;
limit_conn_zone $server_name zone=x8_go_conc:1m;
limit_conn_zone $server_name zone=x8_browse_conc:1m;

limit_req_zone $server_name zone=x8_novel_global:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=x8_go_human:1m rate=10r/s;
limit_req_zone $x8_ai_client zone=x8_ai_site:1m rate=10r/m;
limit_req_zone $x8_ai_client zone=x8_ai_go:1m rate=1r/m;
limit_req_zone $x8_deep_page_client zone=x8_deep_page:1m rate=6r/m;
