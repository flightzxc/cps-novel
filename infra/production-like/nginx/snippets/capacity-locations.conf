location ^~ /novel/ {
    limit_conn x8_novel_conc 8;
    limit_req zone=x8_novel_global burst=20 nodelay;
    limit_req zone=x8_ai_site burst=2 nodelay;
    include /etc/nginx/x8-source/snippets/proxy-headers.conf;
    proxy_pass http://app_backend;
}

location ^~ /go/ {
    limit_conn x8_go_conc 16;
    limit_req zone=x8_go_human burst=20 nodelay;
    limit_req zone=x8_ai_go burst=1 nodelay;
    include /etc/nginx/x8-source/snippets/proxy-headers.conf;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/x8-source/snippets/security-headers.conf;
    proxy_pass http://app_backend;
}

location = /browse {
    limit_conn x8_browse_conc 6;
    limit_req zone=x8_deep_page burst=2 nodelay;
    limit_req zone=x8_ai_site burst=2 nodelay;
    include /etc/nginx/x8-source/snippets/proxy-headers.conf;
    proxy_pass http://app_backend;
}
