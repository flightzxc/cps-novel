# Phase 2C · GHCR 发布工作流。
#
# 职责边界：本文件**只负责把一个 Owner 批准的 commit 构建成 GHCR 上的不可变
# `repo@sha256` 工件**，到产出 digest 与 release manifest 为止。它不做部署、
# 不碰 VPS、不跑 migration、不切流量——那些属于 Phase 2C 的部署工单。
#
# 🔴 不自行发明 build 规则。真正的构建契约是 Phase 2B 已经落地的
# `scripts/preproduction/build-release-artifact.sh`，本工作流只是它的调用方：
#   - approved commit 必须是 40-hex，且必须等于 checkout 出来的 HEAD；
#   - 工作区必须干净；
#   - 镜像身份从 `scripts/lib/p1-12-local-env.sh` 派生（APP_VERSION / GIT_COMMIT /
#     BUILD_DATE / 镜像标签），与本机 X8 构建同一套；
#   - 发布身份只认 `repo@sha256:...`，可变的 `0.1.0-*` tag 不构成发布身份
#     （见 docs/adr/ADR-PREPRODUCTION-MAINTENANCE-DEPLOYMENT.md）。
# 改这个工作流之前先读那个脚本；两边对不上时以脚本为准。
#
# 🔴 为什么是 workflow_dispatch 而不是 push/pull_request 自动发布：
# 发布必须是一次**显式动作**，输入就是 Owner 批准的那个 40-hex commit。
# 挂在 push 上会让每一次提交都产生一个 registry 工件，既违背"approved commit"
# 这条契约，也会把 GHCR 塞满没人批准过的镜像。
#
# 🔴 `publish` 默认是 `dry-run`：构建 + 打标签 + 校验，但**不 push**。
# 要真正推上 GHCR 必须显式选 `push`。这条默认值是刻意的，原因见下面
# "package 可见性" 一段。
#
# --- package 可见性（🔴 未解决，需 Owner 处置）------------------------------
# 🔴 2026-09-20 实测推翻了官方文档的默认值说法。
# 官方文档写的是 "When you first publish a package, the default visibility is
# private." 以及 "inherits the access permissions (but not the visibility)"。
# 但从**本 public 仓库**经 Actions + GITHUB_TOKEN 首次推送后实测：
#     docker logout ghcr.io
#     docker pull ghcr.io/flightzxc/cps-novel@sha256:75392b67...
#     → 退出码 0，Downloaded newer image
# 匿名可拉 ⇒ package 实际是 **PUBLIC**。
# 也就是说：在 public 仓库下，经 Actions 发布的 package 实际继承了仓库可见性，
# 文档那句 "default visibility is private" 在这条路径上不成立。
#
# 🔴 判据只认实测，不认文档。推送后必须匿名 pull 验证一次。
#
# 与工单「GHCR package 保持 private」的要求冲突，且工单同时禁止把 package 改成
# public——现在它**已经是** public，不是被谁改的，是这条发布路径的默认结果。
# 处置选项与核对方式见 docs/operations/GHCR_RELEASE_AND_FALLBACK.md §3。
# ---------------------------------------------------------------------------

name: GHCR release

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: "Owner 批准的 40-hex commit（必须是完整 SHA，不接受短码）"
        required: true
        type: string
      publish:
        description: "dry-run = 只构建校验不推送；push = 真正推上 GHCR"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - push
  # 只在本工作流自身或它依赖的发布脚本被改动时跑契约自检，不影响常规 CI。
  pull_request:
    paths:
      - ".github/workflows/ghcr-release.yml"
      - "scripts/preproduction/build-release-artifact.sh"

# 🔴 最小权限：默认只读。`packages: write` 只加在真正需要推送的那个 job 上，
# 不在文件顶层放开。本仓库的 Actions 默认 GITHUB_TOKEN 权限是 read
# （`gh api repos/.../actions/permissions/workflow`），job 级显式声明会覆盖该默认值。
permissions:
  contents: read

concurrency:
  group: ghcr-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 契约自检：不需要 Docker、不需要 registry、不产生任何工件。
  # 验证发布脚本的四条拒绝路径确实会拒绝——这是"发布只认 approved commit"
  # 这条纪律的回归锚点，脚本被改松时这里会红。
  # ---------------------------------------------------------------------------
  contract:
    name: Release contract self-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发布脚本必须拒绝非法输入
        env:
          REGISTRY_IMAGE: ghcr.io/example/placeholder
        run: |
          set -uo pipefail
          # 🔴 GitHub Actions 的 run 步骤默认 shell 是 `bash -e`（日志里的
          # `shell: /usr/bin/bash -e {0}`）。本步骤**故意**执行会以 65 退出的命令来
          # 验证拒绝路径，errexit 会在第一条拒绝处直接中断整步，连 `rc=$?` 都取不到。
          # 本地用 `bash -c` 跑不带 -e，所以这个差异只在 CI 上暴露。必须显式关掉。
          set +e
          script=scripts/preproduction/build-release-artifact.sh
          [ -x "$script" ] || { echo "CONTRACT=FAIL reason=script_missing_or_not_executable"; exit 1; }
          fail=0

          expect_refusal() {
            local label="$1" want="$2"; shift 2
            local out rc
            out="$(env "$@" "$script" 2>&1)"; rc=$?
            if [ "$rc" -eq 65 ] && printf '%s' "$out" | grep -q "RELEASE_BUILD=REFUSED reason=$want"; then
              echo "  PASS  $label → refused($want)"
            else
              echo "  FAIL  $label → rc=$rc out=$(printf '%s' "$out" | tail -1)"; fail=1
            fi
          }

          head="$(git rev-parse HEAD)"
          echo "契约自检（HEAD=$head）:"
          # 1. 短码 / 非 40-hex 一律拒绝
          expect_refusal "短码 commit"        commit_shape       APPROVED_GIT_COMMIT=abc1234 REGISTRY_IMAGE=ghcr.io/example/placeholder
          # 2. REGISTRY_IMAGE 带 tag 或 digest 一律拒绝（发布身份只能是 repo@sha256）
          expect_refusal "REGISTRY_IMAGE 带 tag" registry_image_shape APPROVED_GIT_COMMIT="$head" REGISTRY_IMAGE=ghcr.io/example/placeholder:latest
          # 3. approved commit 与 HEAD 不一致一律拒绝
          expect_refusal "commit 与 HEAD 不符" unapproved_head    APPROVED_GIT_COMMIT=0000000000000000000000000000000000000000 REGISTRY_IMAGE=ghcr.io/example/placeholder

          [ "$fail" -eq 0 ] || { echo "CONTRACT=FAIL"; exit 1; }
          echo "CONTRACT=PASS"

  # ---------------------------------------------------------------------------
  # 真正的发布。只有 workflow_dispatch 能触发。
  # ---------------------------------------------------------------------------
  release:
    name: Build and publish to GHCR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 校验 approved commit 形状
        run: |
          set -euo pipefail
          commit='${{ inputs.approved_commit }}'
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "REFUSED reason=approved_commit_shape value=$commit"
            echo "必须是完整 40-hex commit；短码不构成发布身份。"
            exit 65
          }
          echo "APPROVED_GIT_COMMIT=$commit"

      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit }}
          fetch-depth: 0

      - name: 确认 checkout 出来的就是那个 commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          [ "$head" = '${{ inputs.approved_commit }}' ] || {
            echo "REFUSED reason=checkout_mismatch head=$head"; exit 65;
          }
          [ -z "$(git status --porcelain=v1)" ] || {
            echo "REFUSED reason=dirty_checkout"; exit 65;
          }
          echo "HEAD=$head 干净"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 🔴 用 GITHUB_TOKEN，不创建也不使用任何 PAT。
      # 只在需要推送时登录；dry-run 不登录，减少一次凭据暴露面。
      - name: Log in to GHCR
        if: inputs.publish == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "GHCR_LOGIN=OK"

      - name: Build release artifact
        id: build
        env:
          APPROVED_GIT_COMMIT: ${{ inputs.approved_commit }}
        run: |
          set -euo pipefail
          # REGISTRY_IMAGE 必须小写且不带 tag/digest——脚本会校验形状。
          registry_image="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          export REGISTRY_IMAGE="$registry_image"
          echo "REGISTRY_IMAGE=$registry_image"

          if [ '${{ inputs.publish }}' = 'push' ]; then
            scripts/preproduction/build-release-artifact.sh --push | tee /tmp/release.out
          else
            # dry-run：不 push。脚本在没有 registry digest 时会以
            # reason=immutable_registry_digest_missing 拒绝——这是**预期**行为，
            # 因为未推送的镜像本来就没有 repo@sha256。这里据此断言"构建成功、
            # 只差推送"，不把它当失败，也不伪造一个 digest。
            set +e
            scripts/preproduction/build-release-artifact.sh | tee /tmp/release.out
            rc=${PIPESTATUS[0]}
            set -e
            if grep -q "reason=immutable_registry_digest_missing" /tmp/release.out; then
              echo "DRY_RUN=PASS 构建与打标签完成，未推送（无 registry digest 属预期）"
              echo "dry_run=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "DRY_RUN=FAIL rc=$rc"; exit "${rc:-1}"
          fi

          manifest="$(grep '^RELEASE_MANIFEST=' /tmp/release.out | cut -d= -f2-)"
          [ -n "$manifest" ] && [ -f "$manifest" ] || { echo "REFUSED reason=manifest_missing"; exit 65; }
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          node -e '
            const m=require(process.argv[1]);
            if(!/^.+@sha256:[0-9a-f]{64}$/.test(m.image)) { console.log("REFUSED reason=manifest_digest_shape"); process.exit(65); }
            console.log("digest="+m.image);
            console.log("commit="+m.commit);
          ' "$manifest" | tee -a "$GITHUB_OUTPUT"

      # 推送后必须真的按 digest 拉回来，并核对镜像标签里的 revision。
      # 只看 push 成功不算数——那证明不了 digest 可被下游消费。
      - name: Verify pull-by-digest and revision label
        if: inputs.publish == 'push'
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          commit='${{ inputs.approved_commit }}'
          [ -n "$digest" ] || { echo "REFUSED reason=no_digest"; exit 65; }

          docker image rm -f "$digest" >/dev/null 2>&1 || true
          docker pull "$digest"

          revision="$(docker image inspect "$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          source_label="$(docker image inspect "$digest" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
          [ "$revision" = "$commit" ] || { echo "REFUSED reason=revision_mismatch revision=$revision"; exit 65; }
          echo "PULL_BY_DIGEST=PASS"
          echo "revision=$revision"
          echo "source=$source_label"

      - name: Summary
        if: always()
        run: |
          {
            echo "## GHCR release"
            echo ""
            echo "- approved commit: \`${{ inputs.approved_commit }}\`"
            echo "- mode: \`${{ inputs.publish }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest || 'n/a (dry-run)' }}\`"
            echo ""
            echo "> package 可见性未由本工作流设置；本仓库为 public，首次推送可能产生 public package。"
            echo "> 处置见本文件顶部\"package 可见性\"一段与 docs/operations/GHCR_RELEASE_AND_FALLBACK.md。"
          } >> "$GITHUB_STEP_SUMMARY"
