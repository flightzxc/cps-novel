x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app-runtime: &app-runtime
  image: ${CPS_NOVEL_APP_IMAGE:?CPS_NOVEL_APP_IMAGE is required}
  build:
    context: .
    args:
      NODE_BASE_IMAGE: ${P1_12_NODE_BASE_IMAGE:-node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
      BUILD_DATE: ${BUILD_DATE:?BUILD_DATE is required}
      NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:?NEXT_PUBLIC_BUILD_VERSION is required}
  user: "1001:1001"
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - runtime
  logging: *json-logging

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cps_novel
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      P1_12_MIGRATION_OWNER_PASSWORD_FILE: /run/secrets/migration_owner_password
      P1_12_WEB_APP_PASSWORD_FILE: /run/secrets/web_app_password
      P1_12_WORKER_APP_PASSWORD_FILE: /run/secrets/worker_app_password
      P1_12_SCHEDULER_APP_PASSWORD_FILE: /run/secrets/scheduler_app_password
      P1_12_ANALYST_RO_PASSWORD_FILE: /run/secrets/analyst_ro_password
      P1_12_BACKUP_ROLE_PASSWORD_FILE: /run/secrets/backup_role_password
    secrets:
      - postgres_admin_password
      - migration_owner_password
      - web_app_password
      - worker_app_password
      - scheduler_app_password
      - analyst_ro_password
      - backup_role_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-p1-12-roles.sh:ro
      - ./infra/postgres/roles.sql:/opt/cps-novel-postgres/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cps_novel"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - runtime
    logging: *json-logging

  web:
    <<: *app-runtime
    command: ["bash", "scripts/start-web.sh"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${P1_12_WEB_DATABASE_URL:?P1_12_WEB_DATABASE_URL is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
      NEXT_PUBLIC_BUILD_VERSION: ${NEXT_PUBLIC_BUILD_VERSION:?NEXT_PUBLIC_BUILD_VERSION is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      SITEMAP_STATIC_DIR: /app/runtime/static-sitemaps
      TRACKING_HASH_SALT: ${TRACKING_HASH_SALT:?TRACKING_HASH_SALT is required}
      TZ: ${TZ:?TZ is required}
      ADMIN_CANONICAL_ORIGIN: ${ADMIN_CANONICAL_ORIGIN:-http://127.0.0.1:3000}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      CHANNEL_CREDENTIAL_ACTIVE_KEY_VERSION: ${CHANNEL_CREDENTIAL_ACTIVE_KEY_VERSION:?CHANNEL_CREDENTIAL_ACTIVE_KEY_VERSION is required}
      CHANNEL_CREDENTIAL_ENCRYPTION_KEY_V1_FILE: /run/secrets/channel_credential_encryption_key_v1
      CHANNEL_CREDENTIAL_FINGERPRINT_KEY_FILE: /run/secrets/channel_credential_fingerprint_key
      CREDENTIAL_MANAGE_ROLES: ${CREDENTIAL_MANAGE_ROLES:-super_admin}
      CREDENTIAL_MANAGE_USER_IDS: ${CREDENTIAL_MANAGE_USER_IDS:-}
      CONTENT_VIEW_ROLES: ${CONTENT_VIEW_ROLES:-super_admin}
      CONTENT_VIEW_USER_IDS: ${CONTENT_VIEW_USER_IDS:-}
      CONTENT_READ_ROLES: ${CONTENT_READ_ROLES:-super_admin}
      CONTENT_READ_USER_IDS: ${CONTENT_READ_USER_IDS:-}
      CONTENT_PUBLISH_ROLES: ${CONTENT_PUBLISH_ROLES:-super_admin}
      CONTENT_PUBLISH_USER_IDS: ${CONTENT_PUBLISH_USER_IDS:-}
      SETTINGS_MANAGE_ROLES: ${SETTINGS_MANAGE_ROLES:-super_admin}
      SETTINGS_MANAGE_USER_IDS: ${SETTINGS_MANAGE_USER_IDS:-}
      TASK_MANAGE_ROLES: ${TASK_MANAGE_ROLES:-super_admin}
      TASK_MANAGE_USER_IDS: ${TASK_MANAGE_USER_IDS:-}
      # promo:claim is the one capability that does NOT default to super_admin.
      # It is a high-risk, upstream-writing grant (requiresTwoFactor, and
      # defaultRoles: [] in src/lib/auth/capabilities.ts), so it stays granted
      # to nobody unless an operator names a role explicitly. Passing it through
      # here is what lets scripts/lib/x8-levels.json turn it on for X8_LEVEL=uat
      # only; unset (Level 0, production) is byte-for-byte today's behaviour.
      PROMO_CLAIM_ROLES: ${PROMO_CLAIM_ROLES:-}
      PROMO_CLAIM_USER_IDS: ${PROMO_CLAIM_USER_IDS:-}
      # RC-10: global 2FA enforcement switch (src/lib/auth/
      # two-factor-enforcement.ts). Canonical values "true" (enforced) /
      # "false" (disabled) -- "required"/"disabled" remain accepted synonyms.
      # Fail-closed default -- unset, "true", "required", or any value other
      # than the exact "false"/"disabled" keeps 2FA required. Only
      # scripts/lib/x8-levels.json's Level UAT sets this to "false";
      # production must never override it.
      ADMIN_TWO_FACTOR_ENFORCEMENT: ${ADMIN_TWO_FACTOR_ENFORCEMENT:-true}
      FEATURE_NOVEL_CATALOG_SYNC: ${FEATURE_NOVEL_CATALOG_SYNC:-false}
      NOVEL_CATALOG_SYNC_ALLOW_WRITE: ${NOVEL_CATALOG_SYNC_ALLOW_WRITE:-false}
      FEATURE_INDEXNOW_OUTBOX: ${FEATURE_INDEXNOW_OUTBOX:-false}
      INDEXNOW_OUTBOX_ALLOW_WRITE: ${INDEXNOW_OUTBOX_ALLOW_WRITE:-false}
      FEATURE_SITEMAP_AUTO_REFRESH: ${FEATURE_SITEMAP_AUTO_REFRESH:-false}
      SITEMAP_AUTO_REFRESH_ALLOW_WRITE: ${SITEMAP_AUTO_REFRESH_ALLOW_WRITE:-false}
      FEATURE_PROMO_LINK_CLAIM: ${FEATURE_PROMO_LINK_CLAIM:-false}
      PROMO_LINK_CLAIM_ALLOW_WRITE: ${PROMO_LINK_CLAIM_ALLOW_WRITE:-false}
      # X8 gate identity work order (2026-09-05), 施工项二: content creation
      # on Web enqueues moboreader.preview_refresh.v1 (src/server/content-
      # creation/preview-enqueue.ts), whose eligibility check in
      # src/lib/tasks/moboreader.ts reads this allowlist from Web's own
      # process.env. Only Worker had it wired before; an unset allowlist
      # resolves to an empty set and the task is rejected as
      # "no_eligible_sources" before it ever reaches the double-gate.
      MOBOREADER_PREVIEW_SOURCE_APP_CODES: ${MOBOREADER_PREVIEW_SOURCE_APP_CODES:-moboreader}
      # PR6 lane F: P2-06.5 tagging double-gate (plus auto-classify's own
      # pair). FEATURE_P2_06_5_TAGGING is the master read gate consumed by
      # src/server/tagging/admin-service.ts's requireTaggingRead -- with it
      # unset/false, /categories and /tags's canonical + mappings pages (and
      # the novel-detail tag panel) render a disabled-state panel instead of
      # throwing TaggingAdminError("tagging_disabled") into the error
      # boundary. FEATURE_P2_06_5_TAG_ADMIN_WRITE additionally gates operator
      # writes from the Admin V1 UI. FEATURE_NOVEL_TAG_AUTO /
      # AUTO_WRITE_AUTHORIZED gate the separate auto-classification task
      # chain; AUTO_WRITE_AUTHORIZED is a fail-closed exact-match string (not
      # a boolean) and must stay "NO" until Owner explicitly authorizes it
      # (P2-06.5 ADR). registered: docs/governance/feature-flag-registry.md.
      FEATURE_P2_06_5_TAGGING: ${FEATURE_P2_06_5_TAGGING:-false}
      FEATURE_P2_06_5_TAG_ADMIN_WRITE: ${FEATURE_P2_06_5_TAG_ADMIN_WRITE:-false}
      FEATURE_NOVEL_TAG_AUTO: ${FEATURE_NOVEL_TAG_AUTO:-false}
      AUTO_WRITE_AUTHORIZED: ${AUTO_WRITE_AUTHORIZED:-NO}
    volumes:
      - sitemap_static:/app/runtime/static-sitemaps
    secrets:
      - channel_credential_encryption_key_v1
      - channel_credential_fingerprint_key
    ports:
      - "127.0.0.1:${P1_12_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app-runtime
    command: ["tsx", "worker/index.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${P1_12_WORKER_DATABASE_URL:?P1_12_WORKER_DATABASE_URL is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      SITEMAP_STATIC_DIR: /app/runtime/static-sitemaps
      TZ: ${TZ:?TZ is required}
      WORKER_ID: ${WORKER_ID:-compose-worker}
      WORKER_TASK_ALLOWLIST: ${WORKER_TASK_ALLOWLIST:?WORKER_TASK_ALLOWLIST is required}
      WORKER_SHUTDOWN_DRAIN_TIMEOUT_MS: ${WORKER_SHUTDOWN_DRAIN_TIMEOUT_MS:-30000}
      FEATURE_NOVEL_CATALOG_SYNC: ${FEATURE_NOVEL_CATALOG_SYNC:-false}
      NOVEL_CATALOG_SYNC_ALLOW_WRITE: ${NOVEL_CATALOG_SYNC_ALLOW_WRITE:-false}
      FEATURE_INDEXNOW_DELIVERY: ${FEATURE_INDEXNOW_DELIVERY:-false}
      INDEXNOW_DELIVERY_ALLOW_WRITE: ${INDEXNOW_DELIVERY_ALLOW_WRITE:-false}
      FEATURE_SITEMAP_AUTO_REFRESH: ${FEATURE_SITEMAP_AUTO_REFRESH:-false}
      SITEMAP_AUTO_REFRESH_ALLOW_WRITE: ${SITEMAP_AUTO_REFRESH_ALLOW_WRITE:-false}
      FEATURE_PROMO_LINK_CLAIM: ${FEATURE_PROMO_LINK_CLAIM:-false}
      PROMO_LINK_CLAIM_ALLOW_WRITE: ${PROMO_LINK_CLAIM_ALLOW_WRITE:-false}
      # PR6 lane F: same P2-06.5 tagging double-gate as the web service --
      # worker/handlers/novel-tag-backfill.ts reads all four directly via
      # process.env (isTaggingEnabled/isAutoTaggingEnabled/
      # isAutoTagWriteAuthorized). AUTO_WRITE_AUTHORIZED must stay "NO".
      FEATURE_P2_06_5_TAGGING: ${FEATURE_P2_06_5_TAGGING:-false}
      FEATURE_P2_06_5_TAG_ADMIN_WRITE: ${FEATURE_P2_06_5_TAG_ADMIN_WRITE:-false}
      FEATURE_NOVEL_TAG_AUTO: ${FEATURE_NOVEL_TAG_AUTO:-false}
      AUTO_WRITE_AUTHORIZED: ${AUTO_WRITE_AUTHORIZED:-NO}
      MOBOREADER_CATALOG_SAFETY_MAX_PAGES: ${MOBOREADER_CATALOG_SAFETY_MAX_PAGES:-2000}
      MOBOREADER_PREVIEW_CHUNK_SIZE: ${MOBOREADER_PREVIEW_CHUNK_SIZE:-25}
      MOBOREADER_PREVIEW_CONCURRENCY: ${MOBOREADER_PREVIEW_CONCURRENCY:-2}
      MOBOREADER_PREVIEW_TIMEOUT_MS: ${MOBOREADER_PREVIEW_TIMEOUT_MS:-20000}
      MOBOREADER_PREVIEW_FRESHNESS_MS: ${MOBOREADER_PREVIEW_FRESHNESS_MS:-86400000}
      MOBOREADER_PREVIEW_SOURCE_APP_CODES: ${MOBOREADER_PREVIEW_SOURCE_APP_CODES:-moboreader}
      MOBOREADER_PREVIEW_SOURCE_ITEM_ALLOWLIST: ${MOBOREADER_PREVIEW_SOURCE_ITEM_ALLOWLIST:-}
      PROMO_LINK_CLAIM_READBACK_ATTEMPTS: ${PROMO_LINK_CLAIM_READBACK_ATTEMPTS:-3}
      PROMO_LINK_CLAIM_READBACK_INTERVAL_MS: ${PROMO_LINK_CLAIM_READBACK_INTERVAL_MS:-2000}
      WORKER_FAILURE_WEBHOOK_URL: ${WORKER_FAILURE_WEBHOOK_URL:-}
      WORKER_FAILURE_WEBHOOK_TIMEOUT_MS: ${WORKER_FAILURE_WEBHOOK_TIMEOUT_MS:-5000}
      WORKER_FAILURE_WEBHOOK_COOLDOWN_SECONDS: ${WORKER_FAILURE_WEBHOOK_COOLDOWN_SECONDS:-1800}
      CHANNEL_CREDENTIAL_ACTIVE_KEY_VERSION: ${CHANNEL_CREDENTIAL_ACTIVE_KEY_VERSION:?CHANNEL_CREDENTIAL_ACTIVE_KEY_VERSION is required}
      CHANNEL_CREDENTIAL_ENCRYPTION_KEY_V1_FILE: /run/secrets/channel_credential_encryption_key_v1
      CHANNEL_CREDENTIAL_FINGERPRINT_KEY_FILE: /run/secrets/channel_credential_fingerprint_key
    volumes:
      - sitemap_static:/app/runtime/static-sitemaps
    secrets:
      - channel_credential_encryption_key_v1
      - channel_credential_fingerprint_key
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'const value=require("node:fs").readFileSync("/proc/1/cmdline","utf8");if(!value.includes("worker/index.ts"))process.exit(1)'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    <<: *app-runtime
    command: ["bash", "scripts/run-scheduler-loop.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${P1_12_SCHEDULER_DATABASE_URL:?P1_12_SCHEDULER_DATABASE_URL is required}
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      TZ: ${TZ:?TZ is required}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      FEATURE_INDEXNOW_DELIVERY: ${FEATURE_INDEXNOW_DELIVERY:-false}
      INDEXNOW_DELIVERY_ALLOW_WRITE: ${INDEXNOW_DELIVERY_ALLOW_WRITE:-false}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e 'const value=require("node:fs").readFileSync("/proc/1/cmdline","utf8");if(!value.includes("run-scheduler-loop.sh"))process.exit(1)'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  runtime:
    name: ${P1_12_COMPOSE_PROJECT:?P1_12_COMPOSE_PROJECT is required}_network

volumes:
  postgres_data:
  sitemap_static:

secrets:
  postgres_admin_password:
    file: ${P1_12_POSTGRES_ADMIN_PASSWORD_FILE:?P1_12_POSTGRES_ADMIN_PASSWORD_FILE is required}
  migration_owner_password:
    file: ${P1_12_MIGRATION_OWNER_PASSWORD_FILE:?P1_12_MIGRATION_OWNER_PASSWORD_FILE is required}
  web_app_password:
    file: ${P1_12_WEB_APP_PASSWORD_FILE:?P1_12_WEB_APP_PASSWORD_FILE is required}
  worker_app_password:
    file: ${P1_12_WORKER_APP_PASSWORD_FILE:?P1_12_WORKER_APP_PASSWORD_FILE is required}
  scheduler_app_password:
    file: ${P1_12_SCHEDULER_APP_PASSWORD_FILE:?P1_12_SCHEDULER_APP_PASSWORD_FILE is required}
  analyst_ro_password:
    file: ${P1_12_ANALYST_RO_PASSWORD_FILE:?P1_12_ANALYST_RO_PASSWORD_FILE is required}
  backup_role_password:
    file: ${P1_12_BACKUP_ROLE_PASSWORD_FILE:?P1_12_BACKUP_ROLE_PASSWORD_FILE is required}
  channel_credential_encryption_key_v1:
    file: ${CHANNEL_CREDENTIAL_ENCRYPTION_KEY_V1_FILE:?CHANNEL_CREDENTIAL_ENCRYPTION_KEY_V1_FILE is required}
  channel_credential_fingerprint_key:
    file: ${CHANNEL_CREDENTIAL_FINGERPRINT_KEY_FILE:?CHANNEL_CREDENTIAL_FINGERPRINT_KEY_FILE is required}
